<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>信箱素材对齐测试</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#18120d;color:#f7ead6}
    *{box-sizing:border-box}
    body{margin:0;background:#18120d}
    .page{width:min(1536px,100%);margin:0 auto;padding:24px}
    h1{margin:0;font-size:20px;font-weight:600}
    .note{margin:8px 0 18px;color:rgba(247,234,214,.7);font-size:14px}
    .stage{position:relative;width:100%;aspect-ratio:3 / 2;overflow:hidden;background:#090704;border:1px solid rgba(255,255,255,.16)}
    .stage > img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill}
    .room-background{z-index:1}
    /* PSD 信箱与 room 背景不是同一套像素坐标，测试页先校准偏移。 */
    .mailbox-artwork{z-index:2;inset:0;width:100%;height:100%;object-fit:fill;opacity:.92;transform:translate(-1.953125%,5.2734375%);transform-origin:center;transition:transform 180ms ease,filter 180ms ease}
    .hotspot:hover + .mailbox-artwork,.hotspot:focus-visible + .mailbox-artwork{filter:brightness(1.12) drop-shadow(0 9px 5px rgba(48,25,10,.18))}
    .hotspot[data-hotspot-state="pressed"] + .mailbox-artwork{filter:brightness(1.04) contrast(1.04) drop-shadow(0 3px 2px rgba(48,25,10,.16));transform:translate(-1.953125%,5.2734375%) translateY(2px) scale(.98) rotate(1deg)}
    .hotspot{position:absolute;z-index:3;left:40.7%;top:28.3%;width:6.2%;height:12.5%;margin:0;padding:0;border:0;background:transparent;cursor:pointer;color:transparent}
    .hotspot:hover,.hotspot:focus-visible{background:transparent;outline:1px solid rgba(255,231,187,.24);outline-offset:3px}
    .hotspot span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}
    .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:rgba(247,234,214,.78);font-size:13px}
    .legend span{display:inline-flex;align-items:center;gap:7px}
    .swatch{width:14px;height:14px;border:1px solid rgba(255,255,255,.4);display:inline-block}
    .swatch.bg{background:#6b5139}.swatch.asset{background:rgba(238,190,121,.8)}.swatch.hotspot{background:rgba(255,231,187,.08);border-color:rgba(255,231,187,.42)}
    .coords{margin-top:12px;color:rgba(247,234,214,.55);font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
  </style>
</head>
<body>
  <main class="page">
    <h1>信箱素材对齐测试页</h1>
    <p class="note">这里只验证背景图、信箱 PNG 和 hotspot 三层是否对齐，不连接正式咨询室流程。</p>
    <div class="stage">
      <img class="room-background" src="assets/counseling-room.png" alt="咨询室背景">
      <img class="mailbox-artwork" src="assets/mailbox-layered.png" alt="分层 PSD 导出的信箱 PNG">
      <button id="mailboxHotspotTest" class="hotspot" type="button" aria-label="测试信箱点击区域"></button>
    </div>
    <div class="legend">
      <span><i class="swatch bg"></i>room 背景</span>
      <span><i class="swatch asset"></i>信箱 PNG</span>
      <span><i class="swatch hotspot"></i>半透明点击区域</span>
    </div>
    <div class="coords">分层信箱 PNG：完整画布 1536×1024；透明边界 x 655–755 / y 236–372；hotspot：left 41.5% / top 21.5% / width 8.8% / height 18.5%</div>
  </main>
  <script>
    const mailboxHotspotTest=document.querySelector('#mailboxHotspotTest');
    let mailboxPressTimer=null;
    function pressMailboxTest(){
      mailboxHotspotTest.dataset.hotspotState='pressed';
      window.clearTimeout(mailboxPressTimer);
      mailboxPressTimer=window.setTimeout(()=>{mailboxHotspotTest.dataset.hotspotState='idle'},180);
    }
    mailboxHotspotTest.addEventListener('pointerdown',pressMailboxTest);
    mailboxHotspotTest.addEventListener('click',event=>{if(event.detail===0)pressMailboxTest()});
  </script>
</body>
</html>
